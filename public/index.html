<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Gallery</title>
  <!-- Link to the CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main container for the gallery -->
  <div id="mainBody">
    <h1>Photo Gallery</h1>
    <!-- Table for arranging images in a grid -->
    <table id="imagesGrid">
      <tr>
        <td><img src="images/image1.jpg" alt="Image 1"></td>
        <td><img src="images/image2.jpg" alt="Image 2"></td>
        <td><img src="images/image3.jpg" alt="Image 3"></td>
        <td><img src="images/image4.jpg" alt="Image 4"></td>
      </tr>
      <tr>
        <td><img src="images/image5.jpg" alt="Image 5"></td>
        <td><img src="images/image6.jpg" alt="Image 6"></td>
        <td><img src="images/image7.jpg" alt="Image 7"></td>
        <td><img src="images/image8.jpg" alt="Image 8"></td>
      </tr>
    </table>
  </div>
</body>
</html>
